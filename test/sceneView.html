<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Test — scena</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; background:#0a0c0b; color:#e8e2d2;
         margin:0; padding:24px 20px 60px; }
  h1 { font-size:16px; margin:0 0 4px; letter-spacing:.04em; }
  p.sub { color:#8f8f82; margin:0 0 20px; font-size:12.5px; }
  h2 { font-size:13px; color:#c9a24a; margin:22px 0 6px; letter-spacing:.08em; text-transform:uppercase; }
  .t { padding:2px 0 2px 22px; position:relative; }
  .t::before { position:absolute; left:0; width:16px; }
  .ok::before  { content:"PASS"; color:#7cc78a; font-size:9px; top:4px; letter-spacing:.06em; }
  .ko::before  { content:"FAIL"; color:#e0685c; font-size:9px; top:4px; letter-spacing:.06em; }
  .ko { color:#e0685c; }
  .detail { color:#8f8f82; font-size:12px; padding-left:22px; white-space:pre; }
  #summary { position:fixed; left:0; right:0; bottom:0; padding:12px 20px;
             background:#161b19; border-top:1px solid #2b3631; font-weight:700; }
</style>
</head>
<body>
<h1>sceneView.js — scena condivisa</h1>
<p class="sub">Aprila con un server statico: <code>python3 -m http.server</code> → <code>/test/sceneView.html</code></p>
<div id="out"></div>
<div id="summary">✗ modulo non caricato</div>

<script type="module">
import { safeSceneUrl, sceneAction } from '../src/logic/sceneView.js';
const out = document.getElementById('out');
let pass = 0, fail = 0;
const group = (name) => { const h = document.createElement('h2'); h.textContent = name; out.append(h); };
function check(label, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 't ' + (ok ? 'ok' : 'ko');
  d.textContent = label;
  out.append(d);
  if (!ok) {
    const e = document.createElement('div');
    e.className = 'detail';
    e.textContent = `atteso ${JSON.stringify(want)} · ottenuto ${JSON.stringify(got)}`;
    out.append(e);
  }
}

group('safeSceneUrl');
check('https ok', safeSceneUrl('https://cdn.discordapp.com/attachments/1/2/a.png?ex=1'), 'https://cdn.discordapp.com/attachments/1/2/a.png?ex=1');
check('http no', safeSceneUrl('http://x.it/a.png'), null);
check('javascript: no', safeSceneUrl('javascript:alert(1)'), null);
check('data:text/html no', safeSceneUrl('data:text/html;base64,AAAA'), null);
check('data:image ok', safeSceneUrl('data:image/png;base64,iVBORw0KGgo='), 'data:image/png;base64,iVBORw0KGgo=');
check('spazi/virgolette no', safeSceneUrl('https://x.it/a" onerror="x'), null);
check('non stringa / vuoto', [safeSceneUrl(null), safeSceneUrl(undefined), safeSceneUrl(5), safeSceneUrl('')], [null, null, null, null]);

group('sceneAction');
const A = 'https://x.it/a.png', B = 'https://x.it/b.png';
check('primo snapshot con scena: non si apre', sceneAction({ prevUrl: null, nextUrl: A, firstSnapshot: true }), 'none');
check('scena nuova dopo il primo snapshot: open', sceneAction({ prevUrl: null, nextUrl: A, firstSnapshot: false }), 'open');
check('scena sostituita: open', sceneAction({ prevUrl: A, nextUrl: B, firstSnapshot: false }), 'open');
check('stesso URL: none', sceneAction({ prevUrl: A, nextUrl: A, firstSnapshot: false }), 'none');
check('scena eliminata: close', sceneAction({ prevUrl: A, nextUrl: null, firstSnapshot: false }), 'close');
check('nessuna scena al primo snapshot: close (stato iniziale chiuso)', sceneAction({ prevUrl: null, nextUrl: undefined, firstSnapshot: true }), 'close');
check('URL non valido nuovo: close, mai open', sceneAction({ prevUrl: A, nextUrl: 'javascript:1', firstSnapshot: false }), 'close');

document.getElementById('summary').textContent =
  fail === 0 ? `✓ ${pass} test passati` : `✗ ${fail} falliti · ${pass} passati`;
document.getElementById('summary').style.color = fail === 0 ? '#7cc78a' : '#e0685c';
</script>
</body>
</html>
