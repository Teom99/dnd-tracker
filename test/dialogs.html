<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Test — fogli di dialogo</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; background:#0a0c0b; color:#e8e2d2;
         margin:0; padding:24px 20px 60px; }
  h1 { font-size:16px; margin:0 0 4px; letter-spacing:.04em; }
  p.sub { color:#8f8f82; margin:0 0 20px; font-size:12.5px; }
  h2 { font-size:13px; color:#c9a24a; margin:22px 0 6px; letter-spacing:.08em; text-transform:uppercase; }
  .t { padding:2px 0 2px 22px; position:relative; }
  .t::before { position:absolute; left:0; width:16px; }
  .ok::before  { content:"PASS"; color:#7cc78a; font-size:9px; top:4px; letter-spacing:.06em; }
  .ko::before  { content:"FAIL"; color:#e0685c; font-size:9px; top:4px; letter-spacing:.06em; }
  .ko { color:#e0685c; }
  .detail { color:#8f8f82; font-size:12px; padding-left:22px; white-space:pre; }
  #summary { position:fixed; left:0; right:0; bottom:0; padding:12px 20px;
             background:#161b19; border-top:1px solid #2b3631; font-weight:700; }
</style>
</head>
<body>
<h1>dialogs.js — conferme nella pagina</h1>
<p class="sub">Aprila con un server statico: <code>python3 -m http.server</code> → <code>/test/dialogs.html</code></p>
<div id="out"></div>
<div id="summary">✗ modulo non caricato</div>

<script type="module">
import { openSheet, askConfirm, askText, askChoice, closeAllSheets } from '../src/ui/dialogs.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
const group = (name) => { const h = document.createElement('h2'); h.textContent = name; out.append(h); };
function check(label, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 't ' + (ok ? 'ok' : 'ko');
  d.textContent = label;
  out.append(d);
  if (!ok) {
    const e = document.createElement('div');
    e.className = 'detail';
    e.textContent = `atteso ${JSON.stringify(want)} · ottenuto ${JSON.stringify(got)}`;
    out.append(e);
  }
}
const tick = () => new Promise(r => setTimeout(r, 20));
const dlg = () => document.querySelector('.sheet-dialog');
const btn = (txt) => [...document.querySelectorAll('.sheet-dialog button')].find(b => b.textContent.trim() === txt);

group('askConfirm');
let p = askConfirm({ title: 'Resettare?', text: 'Tutto sparisce', confirmLabel: 'Resetta', danger: true });
await tick();
check('il foglio esiste con role=dialog e aria-modal', [dlg()?.getAttribute('role') ?? dlg()?.querySelector('[role=dialog]')?.getAttribute('role'), !!dlg()], ['dialog', true]);
check('danger: bottone .btn--danger e nessun .btn--primary', [!!btn('Resetta')?.classList.contains('btn--danger'), !!dlg().querySelector('.btn--primary')], [true, false]);
check('danger: il focus parte su Annulla (un Invio distratto non cancella)', document.activeElement === btn('Annulla'), true);
const ok1 = btn('Resetta'); ok1.click(); ok1.click();
check('conferma = true (anche con doppio clic)', await p, true);
await tick();
check('dopo la chiusura nessun foglio nel DOM', dlg(), null);

p = askConfirm({ title: 'Riposo', confirmLabel: 'Riposo lungo' }); await tick();
check('non danger: il focus parte sulla conferma', document.activeElement === btn('Riposo lungo'), true);
check('non danger: un solo .btn--primary', [!!btn('Riposo lungo').classList.contains('btn--primary'), dlg().querySelectorAll('.btn--primary').length], [true, 1]);
btn('Annulla').click();
check('Annulla = false', await p, false);

p = askConfirm({ title: 'x', confirmLabel: 'Sì' }); await tick();
document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
check('Esc = false', await p, false);

p = askConfirm({ title: 'x', confirmLabel: 'Sì' }); await new Promise(r => setTimeout(r, 400));
dlg().dispatchEvent(new MouseEvent('click', { bubbles: true }));
check('clic sul velo (dopo la soglia) = false', await p, false);

p = askConfirm({ title: 'Eliminare <b>x</b>?', text: 'a "b" <i>c</i>', confirmLabel: 'Sì' }); await tick();
check('il testo resta testo (nessun <b>/<i> nel DOM)', [dlg().querySelector('b'), dlg().querySelector('i')], [null, null]);
btn('Annulla').click(); await p;

group('askText');
p = askText({ title: 'Nuova creatura', label: 'Nome', value: '  Orco  ', confirmLabel: 'Aggiungi' }); await tick();
check('il focus parte sul campo', document.activeElement === dlg().querySelector('input'), true);
btn('Aggiungi').click();
check('valore trimmato', await p, 'Orco');
p = askText({ title: 'Nuova creatura', label: 'Nome', confirmLabel: 'Aggiungi' }); await tick();
btn('Aggiungi').click();
check('vuoto = null', await p, null);
p = askText({ title: 'Nuova creatura', label: 'Nome', value: 'Lupo', confirmLabel: 'Aggiungi' }); await tick();
dlg().querySelector('input').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
check('Invio nel campo conferma', await p, 'Lupo');

group('askChoice');
p = askChoice({ title: 'Già presente', primaryLabel: 'Rientra', secondaryLabel: 'Sostituisci' }); await tick();
check('un solo .btn--primary', dlg().querySelectorAll('.btn--primary').length, 1);
btn('Sostituisci').click();
check('secondary', await p, 'secondary');
p = askChoice({ title: 'Già presente', primaryLabel: 'Rientra', secondaryLabel: 'Sostituisci' }); await tick();
btn('Rientra').click();
check('primary', await p, 'primary');
p = askChoice({ title: 'Già presente', primaryLabel: 'Rientra', secondaryLabel: 'Sostituisci' }); await tick();
btn('Annulla').click();
check('Annulla = null', await p, null);

group('coda');
const order = [];
const p1 = askConfirm({ title: 'uno', confirmLabel: 'Sì' }).then(v => order.push('1:' + v));
const p2 = askConfirm({ title: 'due', confirmLabel: 'Sì' }).then(v => order.push('2:' + v));
await tick();
check('un solo foglio aperto alla volta', document.querySelectorAll('.sheet-dialog').length, 1);
check('è il primo', dlg().textContent.includes('uno'), true);
btn('Sì').click(); await tick();
check('poi si apre il secondo', dlg()?.textContent.includes('due'), true);
btn('Annulla').click(); await Promise.all([p1, p2]);
check('ordine e risultati', order, ['1:true', '2:false']);
check('nessun foglio rimasto', document.querySelectorAll('.sheet-dialog').length, 0);

group('openSheet generico');
p = openSheet({ title: 'T', buttons: [{ id: 'a', label: 'A', kind: 'primary' }, { id: 'b', label: 'B', kind: 'danger' }, { id: 'c', label: 'C', kind: 'plain' }] }); await tick();
btn('B').click();
check('restituisce id e valore', await p, { id: 'b', value: null });

group('click-through e velo');
let pz = askConfirm({ title: 'z', confirmLabel: 'Sì' }); await tick();
dlg().dispatchEvent(new MouseEvent('click', { bubbles: true }));
await tick();
check('un clic sul velo subito dopo l\'apertura NON chiude (doppio clic sul menu)', !!dlg(), true);
btn('Annulla').click(); await pz; 
check('dopo la chiusura c\'è lo scudo anti click-through', !!document.querySelector('.sheet-dialog-shield'), true);
await new Promise(r => setTimeout(r, 400));
check('lo scudo sparisce dopo ~300 ms', document.querySelector('.sheet-dialog-shield'), null);

group('closeAllSheets');
const q1 = askConfirm({ title: 'uno', confirmLabel: 'Sì' });
const q2 = askConfirm({ title: 'due', confirmLabel: 'Sì' });
await tick();
closeAllSheets();
check('il foglio aperto e quello in coda si risolvono a false', [await q1, await q2], [false, false]);
await tick();
check('nessun foglio rimasto nel DOM', document.querySelectorAll('.sheet-dialog').length, 0);
const q3 = askConfirm({ title: 'dopo', confirmLabel: 'Sì' }); await tick();
check('una conferma successiva funziona di nuovo', dlg()?.textContent.includes('dopo'), true);
btn('Sì').click(); check('e si risolve', await q3, true);

document.getElementById('summary').textContent =
  fail === 0 ? `✓ ${pass} test passati` : `✗ ${fail} falliti · ${pass} passati`;
document.getElementById('summary').style.color = fail === 0 ? '#7cc78a' : '#e0685c';
</script>
</body>
</html>
